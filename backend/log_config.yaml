version: 1
disable_existing_loggers: false

formatters:
  colored:
    (): colorlog.ColoredFormatter
    format: "%(asctime)s %(log_color)s[%(levelname)s]%(reset)s %(name)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    log_colors:
      DEBUG: cyan
      INFO: green
      WARNING: yellow
      ERROR: red
      CRITICAL: bold_red

  plain:
    format: "%(asctime)s [%(levelname)s] %(name)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: colored
    stream: ext://sys.stdout

  file:
    class: app.infrastructure.logging.handler.SafeRotatingFileHandler
    formatter: plain
    filename: "../data/log/app.log"
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    delay: true

root:
  level: INFO
  handlers: [console, file]

loggers:
  app:
    level: DEBUG
    propagate: true
  uvicorn.error:
    level: INFO
    propagate: false
    handlers: [console, file]
  uvicorn.access:
    level: INFO
    propagate: false
    handlers: [console, file]
