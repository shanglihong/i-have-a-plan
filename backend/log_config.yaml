version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "%(asctime)s [%(levelname)s] %(name)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stdout

root:
  level: INFO
  handlers: [console]

loggers:
  app:
    level: DEBUG
    propagate: true
  uvicorn.error:
    level: INFO
    propagate: false
    handlers: [console]
  uvicorn.access:
    level: INFO
    propagate: false
    handlers: [console]
